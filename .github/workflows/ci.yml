name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: |
          set +e
          go test -count=1 ./... 2>&1 | tee test-output.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -vE '^(ok|\?) ' test-output.txt | head -60 | while IFS= read -r line; do
              echo "::error file=.github/workflows/ci.yml,line=1::${line}"
            done
            echo "::error file=.github/workflows/ci.yml,line=1::go test exited with ${rc}"
          fi
          exit "$rc"

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    env:
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.mod
      - name: Build
        run: go build ./...
